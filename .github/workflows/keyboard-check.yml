name: Keyboard check

# 設定画面の辞書の「＋ 追加」を押した時に、キーボードがすぐ出るかを仮想スマホで確かめる（2026-11-06）
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tap add and check keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.shunp.vitmobile/.MainActivity
            sleep 6
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null; adb pull /sdcard/ui.xml ui0.xml > /dev/null
            python3 tools/tap_text.py ui0.xml "＋ 追加" 0 > tap.txt || true
            cat tap.txt
            if [ -s tap.txt ]; then adb shell input tap $(cat tap.txt); fi
            sleep 3
            adb exec-out screencap -p > shot-after-add.png
            adb shell dumpsys input_method | grep -E "mInputShown|mServedView|mCurFocusedWindowName|isInputViewShown" | tee ime.txt
            grep -q "mInputShown=true" ime.txt && echo "KEYBOARD SHOWN" || (echo "KEYBOARD NOT SHOWN"; exit 1)
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-check
          path: |
            shot-*.png
            ui0.xml
            ime.txt
