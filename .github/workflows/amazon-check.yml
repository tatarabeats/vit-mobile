name: Amazon panel check

# 仮想スマホの Chrome で Amazon.co.jp の商品ページを開き、Keepa のグラフとさくらチェッカーのボタンが出るかを画面写真で確かめる（2026-11-05）
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open Amazon in Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure enabled_accessibility_services com.shunp.vitmobile/com.shunp.vitmobile.InputAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell pm list packages | grep -i chrome || true
            adb logcat -c
            adb shell am start -W -a android.intent.action.VIEW -d "https://www.amazon.co.jp/dp/B07WXL5YPW" com.android.chrome
            sleep 20
            adb exec-out screencap -p > shot-amazon-0.png
            # Chrome のお知らせが出ていたら閉じる（仮想スマホだけの手順）
            adb shell uiautomator dump /sdcard/ui0.xml || true
            B=$(adb shell cat /sdcard/ui0.xml | grep -o 'text="No thanks"[^>]*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' | grep -o 'bounds=.*' | grep -o '[0-9]\+' | xargs)
            if [ -n "$B" ]; then set -- $B; adb shell input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 )); fi
            sleep 15
            adb exec-out screencap -p > shot-amazon-1.png
            adb shell input swipe 540 1600 540 900 300
            sleep 8
            adb exec-out screencap -p > shot-amazon-2.png
            adb shell run-as com.shunp.vitmobile cat files/amazon.log > amazon.log || true
            echo "---- amazon.log ----"; cat amazon.log || true
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A40 "FATAL EXCEPTION" logcat.txt | head -80; exit 1; fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-check
          path: |
            shot-*.png
            amazon.log
            ui.xml
            logcat.txt
